[project]
name = "draft-helper"
version = "0.1.0"
description = "Fantasy football auction draft helper built on your league's own Yahoo draft history."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
draft-helper = "draft_helper.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["draft_helper", "draft_helper.analysis"]
